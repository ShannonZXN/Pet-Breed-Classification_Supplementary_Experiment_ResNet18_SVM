<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">ResNet-18 Features + SVM</title>
  <desc id="desc">A pet-breed classification experiment with native-resolution images, 512 frozen features, and validation-selected SVMs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1828"/>
      <stop offset="100%" stop-color="#153b44"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#63e6cf"/>
      <stop offset="100%" stop-color="#9ecaff"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1440" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1440" height="440" rx="24" fill="url(#grid)"/>
  <circle cx="1270" cy="60" r="215" fill="#63e6cf" fill-opacity="0.035"/>
  <circle cx="1310" cy="70" r="150" fill="none" stroke="#63e6cf" stroke-opacity="0.1"/>
  <rect x="66" y="60" width="8" height="36" rx="4" fill="url(#accent)"/>
  <text x="94" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="3" fill="#7de6d5">PET BREED CLASSIFICATION</text>
  <text x="66" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5" fill="#f4f8ff">ResNet-18 Features + SVM</text>
  <text x="69" y="217" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#b5ccd8">Frozen vision features. A shared split. Traceable results.</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="68" y="272" width="382" height="104" rx="15" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="92" y="308" font-size="15" font-weight="600" letter-spacing="2" fill="#82c8c2">INPUT</text>
    <text x="92" y="346" font-size="27" font-weight="600" fill="#eff8fc">Native resolution</text>
    <rect x="470" y="272" width="382" height="104" rx="15" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="494" y="308" font-size="15" font-weight="600" letter-spacing="2" fill="#82c8c2">REPRESENTATION</text>
    <text x="494" y="346" font-size="27" font-weight="600" fill="#eff8fc">512 frozen features</text>
    <rect x="872" y="272" width="500" height="104" rx="15" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="896" y="308" font-size="15" font-weight="600" letter-spacing="2" fill="#82c8c2">MODEL SELECTION</text>
    <text x="896" y="346" font-size="27" font-weight="600" fill="#eff8fc">50 SVM candidates / variant</text>
  </g>
  <rect x="68" y="405" width="1304" height="2" rx="1" fill="url(#accent)" opacity="0.45"/>
</svg>
